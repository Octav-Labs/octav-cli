name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to crates.io (e.g. v0.3.1)"
        required: true
        type: string
      dry_run:
        description: "Package and verify only, without crates.io auth"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: octav
          target: ${{ matrix.target }}
          archive: octav-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: build
    # Runs after a successful binary build on tag push, or standalone via
    # workflow_dispatch (build is skipped there, which is not a failure).
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    # Required reviewer + ref policy (v* tags, main) live on this environment;
    # the crates.io trusted-publishing entry is bound to the same name.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC token exchange with crates.io (trusted publishing)
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-23

      - name: Verify Cargo.toml version matches tag
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $actual"
            exit 1
          fi

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
